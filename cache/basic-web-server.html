<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fetch, Store and Show Data from IndexedDB</title>
</head>
<body>
  <h1>Fetch MySQL Data and Save to IndexedDB</h1>
  <button onclick="fetchAndStore()">Fetch and Store</button>
  <button onclick="showData()">Show Data from IndexedDB</button>

  <h2>Stored Data</h2>
  <pre id="output"></pre>

  <script>
    const payload = {
      "deals": ["Amount", "Phase", "Date of the funding round"],
      "companies": ["Industry", "City"]
    };

    const DB_NAME = "MyAppDB";
    const DB_VERSION = 1;

    function openIndexedDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          for (const table in payload) {
            if (!db.objectStoreNames.contains(table)) {
              db.createObjectStore(table, { keyPath: "id", autoIncrement: true });
            }
          }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function checkIfDataExists(db) {
      const tables = Object.keys(payload);
      const transaction = db.transaction(tables, "readonly");

      return Promise.all(tables.map(table => {
        return new Promise((resolve, reject) => {
          const store = transaction.objectStore(table);
          const request = store.getAll();

          request.onsuccess = (event) => {
            const rows = event.target.result;
            if (rows.length === 0) return resolve(false);

            // Check if required columns exist in at least one row
            const requiredColumns = payload[table];
            const hasAllColumns = rows.some(row =>
              requiredColumns.every(col => col in row)
            );

            resolve(hasAllColumns);
          };

          request.onerror = () => reject(false);
        });
      })).then(results => results.every(Boolean));
    }

    async function fetchAndStore() {
      try {
        const db = await openIndexedDB();
        const dataExists = await checkIfDataExists(db);

        if (dataExists) {
          console.log("Datos ya existentes en IndexedDB. No se hace fetch.");
          db.close();
          return;
        }

        const response = await fetch("http://127.0.0.1:5000/tables", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        const tx = db.transaction(Object.keys(payload), "readwrite");

        for (const table in data) {
          const store = tx.objectStore(table);
          for (const row of data[table]) {
            store.put(row);
          }
        }

        tx.oncomplete = () => {
          console.log("Todos los datos se han almacenado en IndexedDB.");
          db.close();
        };

        tx.onerror = () => {
          console.error("Error en la transacción", tx.error);
        };

      } catch (err) {
        console.error("Error al obtener o almacenar los datos:", err);
      }
    }

    async function showData() {
      const db = await openIndexedDB();
      const outputElement = document.getElementById("output");
      outputElement.textContent = "";

      const tables = Object.keys(payload);
      for (const table of tables) {
        const store = db.transaction(table).objectStore(table);
        const request = store.getAll();

        request.onsuccess = (event) => {
          outputElement.textContent += `\n\nTable: ${table}\n`;
          outputElement.textContent += JSON.stringify(event.target.result, null, 2);
        };

        request.onerror = (error) => {
          console.error("Error al recuperar datos de IndexedDB", error);
        };
      }

      db.close();
    }
  </script>
</body>
</html>
